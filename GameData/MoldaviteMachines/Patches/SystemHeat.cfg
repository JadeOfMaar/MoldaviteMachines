@PART[mmgh-pbr-*]:NEEDS[SystemHeatConverters]:FOR[MoldaviteMachines]
{
	MODULE
	{
		name = ModuleSystemHeatCryoTank
		systemHeatModuleID = culture
		BOILOFFCONFIG
		{
			FuelName = Photoculture
			BoiloffRate = 0.02
			CoolingHeatCost = 0.004
			CryocoolerTemperature = 350
		}
	}
}
@PART[mmgh-alg-*]:NEEDS[SystemHeatConverters]:FOR[MoldaviteMachines]
{
	MODULE
	{
		name = ModuleSystemHeatCryoTank
		systemHeatModuleID = culture
		BOILOFFCONFIG
		{
			FuelName = Algae
			BoiloffRate = 0.02
			CoolingHeatCost = 0.007
			CryocoolerTemperature = 350
		}
	}
}
@PART[mmgh-alg-*|mmgh-pbr-*]:NEEDS[SystemHeatConverters]:AFTER[MoldaviteMachines]
{
	MODULE
	{
		name = ModuleSystemHeat
		volume = #$/mass$
		moduleID = culture
		iconName = Icon_Gears
		ignoreTemperature = true
	}
	
	@MODULE[ModuleResourceConverter]:HAS[#Tag[MMGH*],@INPUT_RESOURCE:HAS[#ResourceName[ElectricCharge]],#ConverterName]
	{ 
		@name = ModuleSystemHeatConverter
		moduleID = #$ConverterName$ //this should be the localization string or the actual name, either way, unique.
		systemHeatModuleID = culture
		shutdownTemperature = 500
		systemOutletTemperature = 350
		systemEfficiency
		{
			key = 0 0
			key = 188 0.14
			key = 275 0.5
			key = 340 0.98
			key = 385 0.9
			key = 500 0
		}
    
		systemPower = #$INPUT_RESOURCE:HAS[#ResourceName[ElectricCharge]]/Ratio$ 
		@systemPower *= 0.9
		!ThermalEfficiency {}
		!TemperatureModifier {}
		@GeneratesHeat = false //disable stock heating
	}
}